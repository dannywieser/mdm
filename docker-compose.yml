services:
  web:
    restart: unless-stopped
    image: ghcr.io/dannywieser/mdm-web:${MDM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      notes-api:
        condition: service_healthy
      flag-manager:
        condition: service_healthy
      image-server:
        condition: service_healthy
      habit-tracker:
        condition: service_healthy
      stats-service:
        condition: service_healthy
    ports:
      - "80:80"

  notes-api:
    restart: unless-stopped
    image: ghcr.io/dannywieser/mdm-notes-api:${MDM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/notes-api.Dockerfile
    depends_on:
      - redis
    environment:
      APP_CONFIG_PATH: "/app/app.config.json"
      PORT: "3000"
      NOTES_ROOT: "/data/notes"
      REDIS_URL: "redis://redis:6379"
    expose:
      - "3000"
    volumes:
      - ./app.config.json:/app/app.config.json:ro
      - ${NOTES_ROOT:-./notes}:/data/notes:ro

  notes-ingest:
    restart: unless-stopped
    image: ghcr.io/dannywieser/mdm-notes-ingest:${MDM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/notes-ingest.Dockerfile
    depends_on:
      - redis
    environment:
      PORT: "3005"
      REDIS_URL: "redis://redis:6379"
    # Bound to all interfaces (not 127.0.0.1, unlike redis/imgproxy below) so
    # bear-sync, running on a separate Mac on the LAN, can reach it directly.
    # Only relevant when notesSource is "bear" — otherwise this service just
    # sits idle.
    ports:
      - "3005:3005"

  flag-manager:
    restart: unless-stopped
    image: ghcr.io/dannywieser/mdm-flag-manager:${MDM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/flag-manager.Dockerfile
    depends_on:
      - redis
    environment:
      APP_CONFIG_PATH: "/app/app.config.json"
      PORT: "3001"
      REDIS_URL: "redis://redis:6379"
    expose:
      - "3001"
    volumes:
      - ./app.config.json:/app/app.config.json:ro

  habit-tracker:
    restart: unless-stopped
    image: ghcr.io/dannywieser/mdm-habit-tracker:${MDM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/habit-tracker.Dockerfile
    depends_on:
      - redis
    environment:
      APP_CONFIG_PATH: "/app/app.config.json"
      PORT: "3003"
      NOTES_ROOT: "/data/notes"
      REDIS_URL: "redis://redis:6379"
    expose:
      - "3003"
    volumes:
      - ./app.config.json:/app/app.config.json:ro
      - ${NOTES_ROOT:-./notes}:/data/notes:ro

  stats-service:
    restart: unless-stopped
    image: ghcr.io/dannywieser/mdm-stats-service:${MDM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/stats-service.Dockerfile
    depends_on:
      - redis
    environment:
      APP_CONFIG_PATH: "/app/app.config.json"
      PORT: "3004"
      NOTES_ROOT: "/data/notes"
      REDIS_URL: "redis://redis:6379"
    expose:
      - "3004"
    volumes:
      - ./app.config.json:/app/app.config.json:ro
      - ${NOTES_ROOT:-./notes}:/data/notes:ro

  image-server:
    restart: unless-stopped
    image: ghcr.io/dannywieser/mdm-image-server:${MDM_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/image-server.Dockerfile
    depends_on:
      - imgproxy
      - redis
    environment:
      APP_CONFIG_PATH: "/app/app.config.json"
      PORT: "3002"
      IMGPROXY_PATH_PREFIX: "/imgproxy"
      NOTES_ROOT: "/data/notes"
      REDIS_URL: "redis://redis:6379"
    expose:
      - "3002"
    volumes:
      - ./app.config.json:/app/app.config.json:ro
      - ${NOTES_ROOT:-./notes}:/data/notes:ro

  imgproxy:
    restart: unless-stopped
    image: darthsim/imgproxy:v3.31.0
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: "/"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_QUALITY: "85"
      IMGPROXY_ENFORCE_WEBP: "true"
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${NOTES_ROOT:-./notes}:/data/notes:ro

  redis:
    restart: unless-stopped
    image: redis:8.2.1-alpine3.22
    ports:
      - "127.0.0.1:6379:6379"

  redisinsight:
    restart: unless-stopped
    image: redis/redisinsight:3.8.0
    depends_on:
      - redis
    environment:
      RI_REDIS_HOST: "redis"
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: "mdm"
    # Bound to all interfaces (not 127.0.0.1, unlike redis above) so you can
    # browse it from a machine other than the Docker host, same reasoning as
    # notes-ingest's port — no auth on this either, homelab-only.
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data

volumes:
  redisinsight-data:
